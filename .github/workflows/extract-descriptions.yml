name: Extract template descriptions

on:
  push:
    paths:
      - "**/*.ghx"
      - "scripts/extract_descriptions.py"
      - "scripts/description_format.py"
      - "docs/previews/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract descriptions from .ghx panels
        run: python scripts/extract_descriptions.py

      - name: Commit descriptions.json and manifest.json if changed
        run: |
          if ! git diff --quiet docs/descriptions.json docs/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/descriptions.json docs/manifest.json
            git commit -m "Update template descriptions and manifest"
            git push
          else
            echo "No description changes."
          fi
